name: resolve

on:
  push:
    branches:
      - "master"
    tags:
      - "!*"
  pull_request:
    branches:
    - "*"

jobs:
  resolve:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v3
    - name: Show Xcode toolchain
      run: |
        xcodebuild -version
        xcrun swift --version
    - name: Resolve Package
      run: xcrun swift package resolve
